<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 추석 단체선물대장 상품 카탈로그</title>
<style>
  :root {
    --ink:#1a202c; --ink-2:#4a5568; --ink-3:#8492a6;
    --line:#e2e8f0; --line-soft:#edf2f7; --bg:#f7fafc; --card:#fff;
    /* 단체선물대장 BI — 레드오렌지 (가격·선택·주요 액션) */
    --brand:#F0361C; --brand-deep:#C4260F; --brand-soft:#FFF1ED; --brand-line:#FFC7BB;
    /* 현대벤디스 — 틸 (구조·정보) / 앰버 (보조 배지) */
    --vendys:#00907E; --vendys-deep:#00655A; --vendys-soft:#E7F4F1; --vendys-line:#A3D7CE;
    --amber:#9A6A08; --amber-soft:#FCF3E1; --amber-line:#EBD5A4;
    --good-ink:#276749; --good-bg:#eefaf2; --good-line:#bfe6cd;
    --danger:#c53030; --danger-bg:#fdf0ef; --danger-line:#f2c4c0;
    --shadow:0 1px 2px rgba(26,32,44,.04), 0 4px 12px rgba(26,32,44,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
       color:var(--ink);background:var(--bg);line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased}
  /* 양 사이드 여백 = 기본 28px + 1cm */
  .wrap{max-width:100%;margin:0 auto;padding:0 calc(28px + 1cm) 150px}

  /* ── 상단 고정 마감 배너 ─────────────── */
  .dbanner{position:sticky;top:0;z-index:120;background:linear-gradient(90deg,var(--vendys-deep),var(--vendys));
           color:#fff;text-align:center;padding:9px 16px;font-size:13.5px;letter-spacing:.01em}
  .dbanner b{font-weight:800}
  .dbanner .dd{background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;margin:0 6px;font-weight:800}
  .dbanner .sep{opacity:.5;margin:0 8px}
  .dbanner.urgent{background:linear-gradient(90deg,#9b2c2c,#c53030)}
  .dbanner.closed{background:#4a5568}

  /* ── 헤더 ───────────────────────────── */
  header.hd{padding:22px 0 20px}
  .brandbar{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
  .brandbar img{display:block;width:auto;max-width:100%}
  .brandbar .bl img{height:30px}
  /* 현대벤디스 로고는 HYUNDAI 블록 + 한글 2단 구조라, 아래 글자가 읽히도록 조금 더 높게 */
  .brandbar .br img{height:44px}
  /* 로고 이미지가 없을 때 쓰는 텍스트 워드마크 */
  .wm{display:inline-flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .wm-danche{font-size:18px;color:var(--ink)}
  .wm-danche i{width:16px;height:16px;background:var(--brand);border-radius:4px 4px 4px 1px;display:block}
  .wm-vendys{font-size:16px;color:var(--ink-2)}
  .wm-vendys u{display:flex;text-decoration:none}
  .wm-vendys u b{width:8px;height:16px;display:block}
  .wm-vendys u b:nth-child(1){background:var(--vendys)}
  .wm-vendys u b:nth-child(2){background:#111}
  .wm-vendys u b:nth-child(3){background:#E39A0C}
  header.hd h1{margin:0;font-size:clamp(24px,2.05vw,33px);font-weight:800;letter-spacing:-.02em;line-height:1.26}
  header.hd h1 em{font-style:normal;color:var(--brand)}

  /* ── 메인 롤링 배너 ─────────────────── */
  .hero{position:relative;margin:0 0 22px;border-radius:14px;overflow:hidden;background:var(--line-soft)}
  .hero-track{display:flex;transition:transform .45s cubic-bezier(.4,0,.2,1)}
  .hero-slide{flex:0 0 100%;min-width:100%;position:relative}
  /* 이미지 슬라이드 */
  .hero-slide img{display:block;width:100%;height:auto}
  /* 텍스트 슬라이드 */
  .hero-slide.txt{padding:34px 44px;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:9px}
  .hero-slide.txt.c-brand{background:linear-gradient(110deg,var(--brand-deep),var(--brand))}
  .hero-slide.txt.c-vendys{background:linear-gradient(110deg,var(--vendys-deep),var(--vendys))}
  .hero-slide.txt.c-ink{background:linear-gradient(110deg,#1a202c,#3d4759)}
  .hero-slide.txt .hb{align-self:flex-start;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.34);
    color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:4px 12px;letter-spacing:.02em}
  .hero-slide.txt .ht{color:#fff;font-size:clamp(20px,1.7vw,29px);font-weight:800;line-height:1.28;letter-spacing:-.02em}
  .hero-slide.txt .hs{color:rgba(255,255,255,.92);font-size:clamp(13px,1vw,15px);line-height:1.55;max-width:820px}
  .hero-slide a.hlink{position:absolute;inset:0;text-decoration:none}
  .hero-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;
    border:0;background:rgba(26,32,44,.42);color:#fff;font-size:24px;line-height:1;cursor:pointer;
    display:none;align-items:center;justify-content:center;z-index:2;padding-bottom:3px}
  .hero-nav:hover{background:rgba(26,32,44,.68)}
  .hero-nav.prev{left:14px} .hero-nav.next{right:14px}
  .hero.multi .hero-nav{display:flex}
  .hero-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:none;gap:7px;z-index:2}
  .hero.multi .hero-dots{display:flex}
  .hero-dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;cursor:pointer;
    background:rgba(255,255,255,.48);transition:all .2s}
  .hero-dots button.on{background:#fff;width:24px;border-radius:999px}
  @media (max-width:640px){
    .hero-slide.txt{padding:24px 22px;min-height:150px}
    .hero-nav{width:32px;height:32px;font-size:20px}
    .hero-nav.prev{left:8px} .hero-nav.next{right:8px}
  }
  @media (prefers-reduced-motion:reduce){ .hero-track{transition:none} }

  /* ── 접속 시 팝업 배너 ─────────────── */
  .pop-bg{position:fixed;inset:0;background:rgba(26,32,44,.6);z-index:400;
    display:none;align-items:center;justify-content:center;padding:22px}
  .pop-bg.open{display:flex}
  .pop{background:var(--card);border-radius:16px;max-width:460px;width:100%;overflow:hidden;
    box-shadow:0 18px 48px rgba(26,32,44,.3);position:relative;
    max-height:90vh;display:flex;flex-direction:column}
  .pop .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:0;
    background:rgba(26,32,44,.5);color:#fff;font-size:18px;line-height:1;cursor:pointer;z-index:2}
  .pop .x:hover{background:rgba(26,32,44,.75)}
  .pop-img{display:block;width:100%;height:auto}
  .pop-body{padding:24px 26px 20px;overflow:auto}
  .pop-body .pb{display:inline-block;background:var(--brand-soft);border:1px solid var(--brand-line);
    color:var(--brand-deep);font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;margin-bottom:10px}
  .pop-body h3{margin:0 0 9px;font-size:19px;font-weight:800;line-height:1.34;letter-spacing:-.01em}
  .pop-body p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.65;white-space:pre-line}
  .pop-ft{border-top:1px solid var(--line);padding:13px 26px 15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pop-ft .keep{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);cursor:pointer}
  .pop-ft .keep input{width:15px;height:15px;accent-color:var(--vendys);cursor:pointer}
  .pop-cta{margin:16px 0 0;display:block;text-align:center;text-decoration:none;
    background:var(--brand);color:#fff;font-weight:700;font-size:14.5px;border-radius:10px;padding:12px 18px}
  .pop-cta:hover{background:var(--brand-deep)}

  /* ── 검색 ───────────────────────────── */
  .searchbox{position:relative;margin-bottom:16px}
  .searchbox input{width:100%;padding:13px 16px 13px 42px;font-size:15px;font-family:inherit;
    border:2px solid var(--brand-line);border-radius:10px;background:var(--card);color:var(--ink)}
  .searchbox input:focus{outline:none;border-color:var(--brand)}
  .searchbox::before{content:"⌕";position:absolute;left:15px;top:50%;transform:translateY(-50%);
    color:var(--ink-3);font-size:21px;line-height:1}

  /* ── 탭 ─────────────────────────────── */
  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px}
  .tabs button{border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;
    color:var(--ink-3);padding:10px 20px;cursor:pointer;position:relative;top:2px;
    border-bottom:3px solid transparent}
  .tabs button:hover{color:var(--ink-2)}
  .tabs button.on{color:var(--vendys);border-bottom-color:var(--vendys)}
  .tabs .hint{margin-left:auto;align-self:center;font-size:12px;color:var(--ink-3);font-weight:400;padding-bottom:6px}

  /* ── 칩 ─────────────────────────────── */
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:999px;
    padding:7px 15px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap}
  .chip:hover{border-color:var(--brand-line);color:var(--brand)}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
  .chip .c{opacity:.62;font-size:11.5px;margin-left:4px}
  .chip.on .c{opacity:.8}
  .chip:disabled{opacity:.38;cursor:default}
  .chip:disabled:hover{border-color:var(--line);color:var(--ink-2)}

  /* ── 툴바 ───────────────────────────── */
  .toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:16px}
  .toolbar .count{font-size:13.5px;color:var(--ink-2)}
  .toolbar .count b{color:var(--ink);font-size:15px;font-weight:800}
  .spacer{flex:1 1 auto}
  select.sel,.btn{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--ink-2);padding:7px 12px;cursor:pointer}
  select.sel:focus{outline:none;border-color:var(--vendys)}
  .btn{font-weight:600}
  .btn:hover{border-color:var(--ink-3);color:var(--ink)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
  .btn.ghost.on{background:var(--vendys);border-color:var(--vendys);color:#fff}
  .btn:disabled{opacity:.42;cursor:default}
  .btn:disabled:hover{border-color:var(--line);color:var(--ink-2)}
  .viewtog{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .viewtog button{border:0;background:var(--card);color:var(--ink-3);font-family:inherit;font-size:12.5px;
    padding:7px 13px;cursor:pointer;font-weight:600}
  .viewtog button.on{background:var(--vendys);color:#fff}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
  .toggle input{width:15px;height:15px;accent-color:var(--vendys);cursor:pointer}

  /* ── 카드 그리드 ─────────────────────── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s,transform .15s;position:relative}
  .pcard:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--vendys-line)}
  .pcard.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
  .pcard .pick{position:absolute;left:9px;top:9px;z-index:2;width:24px;height:24px;
    accent-color:var(--brand);cursor:pointer}
  .thumb{width:100%;aspect-ratio:1/1;background:#fff;cursor:pointer;overflow:hidden;
    border-bottom:1px solid var(--line-soft)}
  .thumb img{width:100%;height:100%;object-fit:contain;display:block}
  .pbody{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}
  .prow1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .tag{font-size:10.5px;border-radius:5px;padding:2px 7px;font-weight:700;letter-spacing:.01em}
  .tag.cat{background:var(--vendys-soft);color:var(--vendys);border:1px solid var(--vendys-line)}
  .tag.tax{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
  .tag.code{background:var(--line-soft);color:var(--ink-3);font-family:ui-monospace,Consolas,monospace;font-weight:600}
  .pname{font-size:13.5px;font-weight:700;line-height:1.42;margin-bottom:6px;cursor:pointer;min-height:38px}
  .pname:hover{color:var(--vendys)}
  .pmeta{font-size:11.5px;color:var(--ink-3);line-height:1.45;margin-bottom:4px}
  .pmeta b{color:var(--ink-2);font-weight:600}
  .pcomp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:33px}
  .pdesc{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin:6px 0 10px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pdesc a{color:var(--brand);text-decoration:none;font-weight:600}
  .pprice{margin-top:auto;display:flex;align-items:flex-end;gap:7px;flex-wrap:wrap}
  .pprice .now{font-size:19px;font-weight:800;color:var(--brand);letter-spacing:-.01em;line-height:1.1}
  .pprice .now small{font-size:13px;font-weight:700}
  .pprice .rate{font-size:11.5px;font-weight:800;color:#fff;background:var(--brand);border-radius:4px;padding:1px 5px}
  .pprice .was{font-size:12px;color:var(--ink-3);text-decoration:line-through}
  body.nomoney .pprice,body.nomoney .m-price,body.nomoney .money{visibility:hidden}
  body.nomoney .pprice::after{content:"가격 별도 안내";visibility:visible;font-size:12.5px;color:var(--ink-3)}

  /* ── 리스트(테이블) 뷰 ───────────────── */
  .tblwrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
  /* table-layout:fixed — 필터를 바꿔도 열 너비가 흔들리지 않게 고정한다.
     (auto 였을 때는 '전체'에서 긴 원산지 값이 246px까지 벌어지며 상품명을 260px로 눌렀다)
     너비는 아래 colgroup 에서 지정한다. */
  /* min-width 1280px : 이미지 열(5.83%)이 썸네일 74px보다 좁아지지 않는 하한.
     그보다 좁은 화면에서는 .tblwrap 이 가로 스크롤된다. */
  table.list{width:100%;border-collapse:collapse;font-size:13px;min-width:1280px;table-layout:fixed}
  table.list th{background:var(--bg);text-align:left;padding:11px 10px;font-size:12px;color:var(--ink-3);
    font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
  table.list td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  table.list tr:last-child td{border-bottom:0}
  table.list tr.sel{background:var(--brand-soft)}
  table.list tr:hover{background:var(--vendys-soft)}
  table.list tr.sel:hover{background:#ffe6df}
  table.list img{width:74px;height:74px;object-fit:contain;background:#fff;border:1px solid var(--line-soft);border-radius:6px;cursor:pointer}
  table.list .c-code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
  /* ── 열 너비 고정 (카테고리 선택 상태 기준으로 실측한 값) ──
     1612px 기준 실측값을 백분율로 환산해 합계 100% 로 맞췄다.
     col 에는 calc() 가 먹지 않는 브라우저가 있어 백분율로만 지정한다.
     전부 백분율이라 화면이 넓어져도 비율을 유지하며 함께 늘어난다.
        체크 46 · 이미지 94 · 상품코드 84 · 카테고리 100 · 상품명 342
        구성 228 · 상세설명 380 · 원산지 130 · 과세여부 62 · 가격 146 */
  table.list col.w-chk  {width:2.85%}
  table.list col.w-img  {width:5.83%}
  table.list col.w-code {width:5.21%}
  table.list col.w-cat  {width:6.21%}
  table.list col.w-name {width:21.22%}
  table.list col.w-comp {width:14.15%}
  table.list col.w-desc {width:23.57%}
  table.list col.w-orig {width:8.07%}
  table.list col.w-tax  {width:3.85%}
  table.list col.w-price{width:9.04%}

  /* fixed 레이아웃에서는 셀 내용이 넘치면 잘리므로, 한글은 단어 단위로 줄바꿈시킨다 */
  table.list .c-cat{word-break:keep-all;overflow-wrap:anywhere}
  table.list .c-name{font-weight:700;cursor:pointer;word-break:keep-all;overflow-wrap:anywhere}
  table.list .c-name:hover{color:var(--vendys)}
  table.list .c-comp{color:var(--ink-2);font-size:12px;word-break:keep-all;overflow-wrap:anywhere}
  table.list .c-desc{color:var(--ink-2);font-size:12px;line-height:1.55}
  table.list .c-orig{word-break:keep-all;overflow-wrap:anywhere}
  table.list .c-desc .cut{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  table.list .c-desc a{color:var(--brand);text-decoration:none;font-weight:600;font-size:11.5px}
  table.list .c-price{text-align:right;white-space:nowrap}
  table.list .c-price .now{font-size:15px;font-weight:800;color:var(--brand)}
  table.list .c-price .rate{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--brand);
    border-radius:4px;padding:0 4px;margin-left:3px}
  table.list .c-price .was{display:block;font-size:11.5px;color:var(--ink-3);text-decoration:line-through}
  table.list input[type=checkbox]{width:19px;height:19px;accent-color:var(--brand);cursor:pointer}

  .empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--ink-3);
    background:var(--card);border:1px dashed var(--line);border-radius:12px}

  /* ── 상세 모달 ───────────────────────── */
  .mbg{position:fixed;inset:0;background:rgba(26,32,44,.55);z-index:200;display:none;
    align-items:center;justify-content:center;padding:24px}
  .mbg.open{display:flex}
  .modal{background:var(--card);border-radius:14px;max-width:900px;width:100%;max-height:88vh;overflow:auto;position:relative}
  .modal .x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;
    border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:17px;cursor:pointer;z-index:2}
  .modal .x:hover{background:var(--bg);color:var(--ink)}
  .m-top{display:grid;grid-template-columns:330px 1fr;gap:26px;padding:28px 30px 22px}
  .m-img{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .m-img img{width:100%;display:block}
  .m-name{font-size:21px;font-weight:800;margin:8px 0 14px;line-height:1.35}
  .m-price{margin-bottom:18px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .m-price .now{font-size:27px;font-weight:800;color:var(--brand);letter-spacing:-.01em}
  .m-price .rate{font-size:13px;font-weight:800;color:#fff;background:var(--brand);border-radius:5px;padding:2px 7px}
  .m-price .was{font-size:14px;color:var(--ink-3);text-decoration:line-through}
  .m-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px}
  .m-tbl th{text-align:left;padding:7px 12px 7px 0;color:var(--ink-3);font-weight:600;width:78px;
    vertical-align:top;white-space:nowrap}
  .m-tbl td{padding:7px 0;color:var(--ink-2);vertical-align:top;border-bottom:1px solid var(--line-soft)}
  .m-tbl tr:last-child td{border-bottom:0}
  .m-desc{border-top:1px solid var(--line);padding:20px 30px 28px;font-size:13.5px;color:var(--ink-2);
    white-space:pre-wrap;line-height:1.75}
  .m-desc h4{margin:0 0 10px;font-size:12px;color:var(--ink-3);letter-spacing:.06em;font-weight:700}
  @media (max-width:780px){.m-top{grid-template-columns:1fr;padding:22px 20px 18px}}

  /* ── 하단 고정 선택바 ───────────────── */
  .selbar{position:fixed;left:0;right:0;bottom:0;z-index:150;background:rgba(255,255,255,.97);
    border-top:1px solid var(--line);box-shadow:0 -3px 16px rgba(26,32,44,.1);backdrop-filter:blur(6px);
    transform:translateY(105%);transition:transform .22s ease}
  .selbar.show{transform:translateY(0)}
  .selbar-in{max-width:100%;margin:0 auto;padding:13px calc(28px + 1cm);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .selbar .sum{font-size:14px;color:var(--ink-2)}
  .selbar .sum b{color:var(--ink);font-size:17px;font-weight:800}
  .selbar .sum .tot{color:var(--brand);font-weight:800;font-size:18px}

  /* ── 문의 패널 ───────────────────────── */
  .pbg{position:fixed;inset:0;background:rgba(26,32,44,.5);z-index:210;display:none}
  .pbg.open{display:block}
  .panel{position:fixed;right:0;top:0;bottom:0;width:720px;max-width:100%;background:var(--bg);z-index:220;
    display:flex;flex-direction:column;transform:translateX(100%);transition:transform .24s ease}
  .panel.open{transform:translateX(0)}
  .p-hd{padding:18px 24px;background:var(--card);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between}
  .p-hd h3{margin:0;font-size:17px;font-weight:800}
  .p-hd .x{border:0;background:none;font-size:23px;color:var(--ink-3);cursor:pointer;line-height:1}
  .p-body{flex:1;overflow:auto;padding:18px 22px}
  .p-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .p-form label{font-size:11.5px;color:var(--ink-3);font-weight:700;display:block;margin-bottom:4px}
  .p-form .full{grid-column:1/-1}
  .p-form input,.p-form textarea{width:100%;padding:8px 11px;font-size:13.5px;font-family:inherit;
    border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
  .p-form textarea{resize:vertical;min-height:64px;line-height:1.55}
  .p-form input:focus,.p-form textarea:focus{outline:none;border-color:var(--vendys)}
  table.qt{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);
    border:1px solid var(--line);border-radius:9px;overflow:hidden}
  table.qt th{background:var(--bg);padding:9px 8px;font-size:11.5px;color:var(--ink-3);font-weight:700;
    text-align:left;border-bottom:1px solid var(--line)}
  table.qt td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  table.qt tr:last-child td{border-bottom:0}
  table.qt img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:5px}
  table.qt .nm{font-weight:700;line-height:1.35}
  table.qt .cd{font-size:11px;color:var(--ink-3);font-family:ui-monospace,Consolas,monospace}
  table.qt .num{text-align:right;white-space:nowrap}
  table.qt input.q{width:62px;padding:5px 7px;font-size:13px;font-family:inherit;text-align:center;
    border:1px solid var(--line);border-radius:6px;-moz-appearance:textfield}
  table.qt input.q::-webkit-outer-spin-button,table.qt input.q::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  table.qt input.q:focus{outline:none;border-color:var(--vendys);background:var(--vendys-soft)}
  table.qt .del{border:0;background:none;color:var(--ink-3);font-size:16px;cursor:pointer;line-height:1}
  table.qt .del:hover{color:var(--danger)}
  .p-ft{border-top:1px solid var(--line);background:var(--card);padding:15px 22px 20px}
  .ft-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2);margin-bottom:5px}
  .ft-row.total{font-size:17px;font-weight:800;color:var(--ink);padding-top:8px;border-top:1px solid var(--line);margin-top:8px}
  .ft-row.total span:last-child{color:var(--brand)}
  .ft-btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .ft-btns .btn{flex:1 1 130px;text-align:center;padding:10px 12px;font-size:13.5px}
  .ft-note{font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.55}
  .req{color:var(--brand);margin-left:2px}
  .p-form input.bad{border-color:var(--brand);background:var(--brand-soft)}
  .sent{background:var(--card);border:1px solid var(--good-line);border-radius:12px;padding:34px 26px;text-align:center}
  .sent .ico{font-size:40px;line-height:1;margin-bottom:12px}
  .sent h4{margin:0 0 8px;font-size:19px;font-weight:800;color:var(--good-ink)}
  .sent p{margin:0 0 6px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
  .sent .rid{display:inline-block;margin:12px 0 4px;background:var(--good-bg);border:1px solid var(--good-line);
    color:var(--good-ink);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;
    font-family:ui-monospace,Consolas,monospace}
  .sent.warn{border-color:var(--amber-line)}
  .sent.warn h4{color:var(--amber)}
  .sent.warn .rid{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
  .sent.fail{border-color:var(--danger-line)}
  .sent.fail h4{color:var(--danger)}

  .toast{position:fixed;left:50%;bottom:98px;transform:translate(-50%,14px);background:var(--ink);color:#fff;
    padding:10px 20px;border-radius:999px;font-size:13.5px;z-index:300;opacity:0;pointer-events:none;transition:all .2s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  footer.foot{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;
    color:var(--ink-3);line-height:1.75}
  footer.foot b{color:var(--ink-2)}

  /* ── 인쇄(문의서 PDF) ───────────────── */
  #printArea{display:none}
  @media print{
    body{background:#fff}
    body>*:not(#printArea){display:none !important}
    #printArea{display:block !important;padding:0;font-size:12px;color:#000}
    /* 문서 상단 로고 바 — 화면의 로고(data URI)를 그대로 재사용 */
    #printArea .phead{display:flex;align-items:center;justify-content:space-between;
      padding-bottom:9px;border-bottom:1.5px solid #333;margin-bottom:13px}
    #printArea .phead img{height:26px;width:auto;object-fit:contain}
    #printArea .phead .pr img{height:34px}
    #printArea h2{font-size:19px;margin:0 0 4px}
    #printArea .pmeta{font-size:11.5px;color:#555;margin-bottom:14px}
    #printArea .pfoot{margin-top:16px;padding-top:9px;border-top:1px solid #bbb;
      font-size:10.5px;color:#555;line-height:1.6}
    #printArea .pfoot b{font-size:11.5px;color:#000}
    #printArea table{width:100%;border-collapse:collapse;font-size:11px}
    #printArea th,#printArea td{border:1px solid #bbb;padding:6px 7px;text-align:left;vertical-align:top}
    #printArea th{background:#f0f2f5;font-weight:700}
    #printArea td.num{text-align:right;white-space:nowrap}
    #printArea tr.tot td{font-weight:800;background:#f7f9fb}
    #printArea .memo{margin-top:12px;padding:9px 11px;border:1px solid #bbb;background:#fafafa;
      font-size:11px;line-height:1.65;white-space:pre-wrap}
    #printArea .memo b{font-size:10.5px;color:#555}
    #printArea .note{margin-top:12px;font-size:10.5px;color:#555;line-height:1.6}
    #printArea img{width:46px;height:46px;object-fit:contain}
    @page{margin:14mm}
  }

  @media (max-width:640px){
    .wrap{padding:0 12px 160px}
    header.hd h1{font-size:20px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
    .pname{font-size:12.5px;min-height:36px}
    .tabs button{padding:9px 14px;font-size:14px}
    .p-form{grid-template-columns:1fr}
  }
</style>
</head>

/* ── 유틸 ───────────────────────────── */
const $ = id => document.getElementById(id);
const won = n => n.toLocaleString('ko-KR') + '원';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rate = p => (p.was > p.price && p.price > 0) ? Math.round((1 - p.price / p.was) * 100) : 0;
const dday = iso => Math.ceil((new Date(iso + 'T23:59:59') - new Date()) / 86400000);

/* ── 상태 ───────────────────────────── */
const st = { tab: 'price', chip: '__all__', q: '', sort: 'def', view: 'list', onlySel: false };
const sel = new Map();   // code -> qty(숫자 또는 null)
const PANEL_BODY = document.querySelector('.p-body').innerHTML;   // 접수 완료 후 되돌리기용 원본

/* ── 마감 배너 : 주문 마감일만 노출 ── */
(function banner() {
  const b = $('dbanner'), d = dday(CFG.dueOfficial);
  if (d > 0) {
    b.innerHTML = '🎁 <b>주문 마감</b><span class="dd">D-' + d + '</span>' + CFG.dueOfficial + ' 까지';
  } else if (d === 0) {
    b.className = 'dbanner urgent';
    b.innerHTML = '⚠️ <b>오늘이 주문 마감일입니다</b><span class="dd">D-DAY</span>' + CFG.dueOfficial;
  } else {
    b.className = 'dbanner closed';
    b.innerHTML = '주문 마감(' + CFG.dueOfficial + ')이 지났습니다 — 접수 가능 여부는 담당자에게 문의해 주세요.';
  }
})();

/* ── 그룹 정의 ──────────────────────── */
const inBand = (p, b) => p.price >= b.min && p.price < b.max;
function groups() {
  return st.tab === 'price'
    ? CFG.bands.map(b => ({ k: b.k, label: b.label, n: DATA.filter(p => inBand(p, b)).length }))
    : CFG.cats.map(c => ({ k: c, label: c, n: DATA.filter(p => p.cat === c).length }));
}
function buildChips() {
  const gs = groups();
  $('chips').innerHTML = '<button class="chip' + (st.chip === '__all__' ? ' on' : '') + '" data-k="__all__">전체<span class="c">'
    + DATA.length + '</span></button>'
    + gs.map(g => '<button class="chip' + (st.chip === g.k ? ' on' : '') + '" data-k="' + esc(g.k) + '"'
        + (g.n ? '' : ' disabled') + '>' + esc(g.label) + '<span class="c">' + g.n + '</span></button>').join('');
}

/* ── 필터 ───────────────────────────── */
function filtered() {
  const q = st.q.trim().toLowerCase();
  let list = DATA.filter(p => {
    if (st.onlySel && !sel.has(p.code)) return false;
    if (q && !(p.name + ' ' + p.code + ' ' + p.comp + ' ' + p.cat + ' ' + p.scat + ' ' + p.desc).toLowerCase().includes(q)) return false;
    if (st.chip !== '__all__') {
      if (st.tab === 'price') { const b = CFG.bands.find(x => x.k === st.chip); if (!b || !inBand(p, b)) return false; }
      else if (p.cat !== st.chip) return false;
    }
    return true;
  });
  const s = st.sort;
  if (s === 'pl') list.sort((a, b) => a.price - b.price);
  else if (s === 'ph') list.sort((a, b) => b.price - a.price);
  else if (s === 'rt') list.sort((a, b) => rate(b) - rate(a) || a.price - b.price);
  else if (s === 'nm') list.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  return list;
}

/* ── 가격 표기 ──────────────────────── */
function priceCard(p) {
  const r = rate(p);
  return '<div class="pprice"><span class="now">' + p.price.toLocaleString('ko-KR') + '<small>원</small></span>'
    + (r ? '<span class="rate">' + r + '%↓</span><span class="was">' + p.was.toLocaleString('ko-KR') + '원</span>' : '')
    + '</div>';
}

/* ── 렌더 ───────────────────────────── */
function render() {
  const list = filtered();
  $('cnt').textContent = list.length;
  $('cntSub').textContent = '(전체 ' + DATA.length + '개 중' + (st.q ? ' · 검색' : '') + (st.onlySel ? ' · 선택만' : '') + ')';
  const v = $('view');
  if (!list.length) { v.innerHTML = '<div class="empty">조건에 맞는 상품이 없습니다.<br>다른 그룹이나 검색어를 선택해 보세요.</div>'; return; }
  v.innerHTML = st.view === 'card' ? cardHtml(list) : listHtml(list);
}
function cardHtml(list) {
  return '<div class="grid">' + list.map(p => {
    const on = sel.has(p.code);

/* silent=true 면 syncSel()을 건너뛴다 — 전체선택처럼 여러 건을 한 번에 바꿀 때,
   루프 도중 syncSel()이 체크박스 상태를 되돌려 첫 건만 반영되는 문제를 막는다. */
function toggle(code, force, silent) {
  const on = force != null ? force : !sel.has(code);
  if (on) { if (!sel.has(code)) sel.set(code, null); } else sel.delete(code);
  if (!silent) syncSel();
}
function syncSel() {
  const n = sel.size;
  const rows = selRows();
  const tot = rows.reduce((s, r) => s + (r.qty ? r.qty * r.p.price : 0), 0);
  const qty = rows.reduce((s, r) => s + (r.qty || 0), 0);

  $('sbN').textContent = n;
  $('sbTot').textContent = qty ? won(tot) : '수량 미입력';
  $('selbar').classList.toggle('show', n > 0);
  $('onlySel').textContent = '선택한 상품만 보기 (' + n + ')';
  $('onlySel').disabled = !n; $('clearSel').disabled = !n;
  $('ftN').textContent = n + '개'; $('ftQ').textContent = qty.toLocaleString('ko-KR') + '개';
  $('ftTot').textContent = qty ? won(tot) : '수량 입력 시 자동 계산';

  document.querySelectorAll('[data-pick]').forEach(el => {
    const on = sel.has(el.dataset.pick);
    if (el.type === 'checkbox') el.checked = on;
    else if (el.dataset.btn) el.textContent = on ? '선택됨 ✓ (해제하기)' : '이 상품 선택하기';
  });
  document.querySelectorAll('.pcard[data-code],table.list tr[data-code]').forEach(el =>
    el.classList.toggle('sel', sel.has(el.dataset.code)));
  const all = $('allChk');
  if (all) { const vis = [...document.querySelectorAll('table.list tr[data-code]')]; all.checked = vis.length > 0 && vis.every(t => sel.has(t.dataset.code)); }
  if (st.onlySel && !n) { st.onlySel = false; $('onlySel').classList.remove('on'); render(); }
  renderQt();
}
const selRows = () => [...sel.entries()].map(([code, qty]) => ({ p: DATA.find(x => x.code === code), qty }));

function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800); }

/* ── 문의 접수 (구글시트 적재) ──────────────────
   CFG.submitUrl = Apps Script 웹 앱 URL. 비어 있으면 접수 버튼을 숨기고 메일 안내로 대체한다. */
function inquiryId() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return 'Q' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds())
    + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
}
function validate() {
  const need = [['fCo', 'rqCo'], ['fName', 'rqName'], ['fTel', 'rqTel']];
  let bad = null;
  need.forEach(([i]) => {
    const el = $(i), empty = !el.value.trim();
    el.classList.toggle('bad', empty);
    if (empty && !bad) bad = el;
  });
  if (bad) { bad.focus(); toast('고객사명 · 담당자 · 연락처는 필수입니다.'); return false; }
  return true;
}
function payload() {
  const rows = selRows(), f = form();
  return {
    inquiryId: inquiryId(),
    submittedAt: new Date().toISOString(),
    company: f.co, contact: f.nm, phone: f.tel, wishDate: f.date, memo: f.memo,
    source: '웹카탈로그', season: CFG.season,
    dueOfficial: CFG.dueOfficial,
    itemCount: rows.length,
    totalQty: rows.reduce((s, r) => s + (r.qty || 0), 0),
    totalAmount: rows.reduce((s, r) => s + (r.qty ? r.qty * r.p.price : 0), 0),
    items: rows.map(r => ({
      code: r.p.code, name: r.p.name, cat: r.p.scat, tax: r.p.tax,
      price: r.p.price, qty: r.qty || '', amount: r.qty ? r.qty * r.p.price : ''
    }))
  };
}
function showSent(kind, id, msg, title) {
  const cls = kind === 'ok' ? '' : (kind === 'warn' ? ' warn' : ' fail');
  const ico = kind === 'ok' ? '✅' : (kind === 'warn' ? '📨' : '⚠️');
  const ttl = title || (kind === 'ok' ? '문의가 접수되었습니다' : (kind === 'warn' ? '문의를 전송했습니다' : '전송에 실패했습니다'));
  document.querySelector('.p-body').innerHTML =
    '<div class="sent' + cls + '"><div class="ico">' + ico + '</div><h4>' + ttl + '</h4>'
    + '<p>' + msg + '</p>'
    + (id ? '<div class="rid">접수번호 ' + esc(id) + '</div>' : '')
    + '<p style="margin-top:14px"><button class="btn" id="bAgain">다른 상품 더 담기</button></p></div>';
  document.querySelector('.p-ft').style.display = 'none';
}
async function submitInquiry() {
  if (!sel.size) return toast('선택한 상품이 없습니다.');
  if (!validate()) return;
  const btn = $('bSend'), data = payload(), body = JSON.stringify(data);
  btn.disabled = true; btn.textContent = '전송 중…';

  // 실패 화면에서도 PDF로 내보낼 수 있도록 하단 버튼을 되살린다.
  const fallback = () => { document.querySelector('.p-ft').style.display = ''; $('bSend').style.display = 'none'; };

  let ack = null;   // 서버 응답을 실제로 읽었을 때만 채워진다
  try {
    // Content-Type을 지정하지 않아야 preflight 없이 Apps Script가 응답을 돌려준다.
    const res = await fetch(CFG.submitUrl, { method: 'POST', body: body });
    ack = await res.json();
  } catch (e) { /* 응답을 못 읽음 — 아래에서 no-cors로 재시도 */ }

  try {
    if (ack) {
      // 응답을 받았다면 그 판정을 그대로 따른다. 서버가 거부한 건은 재전송하지 않는다.
      if (ack.ok) {
        showSent('ok', ack.inquiryId || data.inquiryId,
          '담당자가 확인 후 <b>영업일 기준 1일 이내</b>에 견적서로 회신드립니다.<br>접수번호를 남겨 두시면 진행 상황을 조회하실 수 있습니다.');
      } else {
        showSent('fail', null, esc(ack.error || '알 수 없는 오류')
          + '<br>입력값을 확인하시거나 <b>PDF 저장</b>으로 내려받아 ' + esc(CFG.contactEmail) + ' 로 보내주세요.',
          '접수가 반려되었습니다');
        fallback();
      }
    } else {
      // 로컬 파일·사내 프록시 등 응답을 읽을 수 없는 환경 — 전송만 시도하고 결과는 단정하지 않는다.
      await fetch(CFG.submitUrl, { method: 'POST', mode: 'no-cors', body: body });
      showSent('warn', data.inquiryId,
        '전송은 되었으나 접수 확인 응답을 받지 못했습니다.<br>확실히 하시려면 <b>PDF 저장</b>으로 내려받아 '
        + esc(CFG.contactEmail) + ' 로도 보내주세요.');
      fallback();
    }
  } catch (e) {
    showSent('fail', null,
      '네트워크 문제로 접수하지 못했습니다.<br><b>PDF 저장</b>으로 내려받아 '
      + esc(CFG.contactEmail) + ' 로 보내주세요.');
    fallback();
  } finally {
    btn.disabled = false; btn.textContent = '문의 접수하기';
  }
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'mX' || t.id === 'mbg') return closeModal();
  if (t.dataset.pick) { toggle(t.dataset.pick, t.type === 'checkbox' ? t.checked : undefined); return; }
  if (t.id === 'allChk') {
    const on = t.checked;   // 루프 중 t.checked가 바뀌므로 미리 확정
    document.querySelectorAll('table.list tr[data-code]').forEach(tr => toggle(tr.dataset.code, on, true));
    syncSel();

  if (t.dataset.rm) { toggle(t.dataset.rm, false); return; }
  const op = t.closest('[data-open]'); if (op) return openModal(op.dataset.open);
  const chip = t.closest('#chips .chip');
  if (chip && !chip.disabled) { st.chip = chip.dataset.k; buildChips(); render(); return; }
  const tab = t.closest('.tabs button');
  if (tab) { st.tab = tab.dataset.tab; st.chip = '__all__';
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b === tab)); buildChips(); render(); return; }
  const vw = t.closest('.viewtog button');
  if (vw) { st.view = vw.dataset.view;
    document.querySelectorAll('.viewtog button').forEach(b => b.classList.toggle('on', b === vw)); render(); syncSel(); return; }
});

$('bPdf').onclick = () => { if (!sel.size) return toast('선택한 상품이 없습니다.'); buildPrint(); window.print(); };

/* ── 메인 롤링 배너 ─────────────────────────────
   CFG.banners = [{badge,title,sub,color,image,link}] . 0개면 렌더하지 않는다. */
(function hero() {
  const list = (CFG.banners || []).filter(b => b && (b.image || b.title || b.sub));
  if (!list.length) return;
  const el = $('hero'), track = $('heroTrack'), dots = $('heroDots');
  el.hidden = false;
  if (list.length > 1) el.classList.add('multi');

  track.innerHTML = list.map(b => {
    const inner = b.image
      ? '<img src="' + esc(b.image) + '" alt="' + esc(b.title || '배너') + '">'
      : '<div class="hb" ' + (b.badge ? '' : 'style="display:none"') + '>' + esc(b.badge || '') + '</div>'
        + '<div class="ht">' + esc(b.title || '') + '</div>'
        + (b.sub ? '<div class="hs">' + esc(b.sub) + '</div>' : '');
    const cls = b.image ? 'hero-slide' : ('hero-slide txt c-' + (b.color || 'brand'));
    const link = b.link ? '<a class="hlink" href="' + esc(b.link) + '" target="_blank" rel="noopener"'
      + ' aria-label="' + esc(b.title || '배너 링크') + '"></a>' : '';
    return '<div class="' + cls + '">' + inner + link + '</div>';
  }).join('');

  dots.innerHTML = list.map((_, i) =>
    '<button data-go="' + i + '" class="' + (i ? '' : 'on') + '" aria-label="' + (i + 1) + '번째 배너"></button>').join('');

  let cur = 0, timer = null;
  const go = i => {
    cur = (i + list.length) % list.length;
    track.style.transform = 'translateX(-' + (cur * 100) + '%)';
    dots.querySelectorAll('button').forEach((b, k) => b.classList.toggle('on', k === cur));
  };
  const stop  = () => { if (timer) { clearInterval(timer); timer = null; } };
  const start = () => {
    stop();
    if (list.length < 2) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    timer = setInterval(() => go(cur + 1), CFG.bannerInterval || 5000);
  };

  $('heroPrev').onclick = () => { go(cur - 1); start(); };
  $('heroNext').onclick = () => { go(cur + 1); start(); };
  dots.onclick = e => { if (e.target.dataset.go != null) { go(+e.target.dataset.go); start(); } };
  el.onmouseenter = stop;
  el.onmouseleave = start;
  // 탭이 백그라운드면 타이머를 멈춰 불필요한 렌더를 막는다
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

  // 모바일 스와이프
  let x0 = null;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; stop(); }, { passive: true });
  el.addEventListener('touchend', e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1));
    x0 = null; start();
  }, { passive: true });

  start();
})();

/* ── 접속 시 팝업 배너 ───────────────────────────
   '오늘 하루 보지 않기'는 localStorage에 날짜를 저장한다.
   CFG.popup.key 를 바꾸면 이전에 닫은 사람에게도 다시 뜬다. */
(function popup() {
  const p = CFG.popup;
  if (!p || !p.enabled || !(p.image || p.title || p.body)) return;
  const skey = 'danche_popup_' + (p.key || 'default');
  const today = new Date().toISOString().slice(0, 10);
  try { if (localStorage.getItem(skey) === today) return; } catch (e) { /* 저장 불가 환경은 그냥 표시 */ }

  const bg = $('popBg');
  $('pop').innerHTML = '<button class="x" id="popX" aria-label="닫기">&times;</button>'
    + (p.image ? '<img class="pop-img" src="' + esc(p.image) + '" alt="' + esc(p.title || '공지') + '">' : '')
    + '<div class="pop-body">'
      + (p.badge ? '<span class="pb">' + esc(p.badge) + '</span>' : '')
      + (p.title ? '<h3>' + esc(p.title) + '</h3>' : '')
      + (p.body ? '<p>' + esc(p.body) + '</p>' : '')
      + (p.link ? '<a class="pop-cta" href="' + esc(p.link) + '" target="_blank" rel="noopener">'
                  + esc(p.linkText || '자세히 보기') + '</a>' : '')
    + '</div>'
    + '<div class="pop-ft">'
      + '<label class="keep"><input type="checkbox" id="popKeep"> 오늘 하루 보지 않기</label>'
      + '<span class="spacer"></span>'
      + '<button class="btn" id="popClose">닫기</button>'
    + '</div>';

  const close = () => {
    const keep = $('popKeep');
    if (keep && keep.checked) { try { localStorage.setItem(skey, today); } catch (e) {} }
    bg.classList.remove('open');
    document.body.style.overflow = '';
  };
  bg.classList.add('open');
  document.body.style.overflow = 'hidden';
  $('popX').onclick = close;
  $('popClose').onclick = close;
  bg.onclick = e => { if (e.target === bg) close(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && bg.classList.contains('open')) close(); });
})();

/* ── 초기화 ─────────────────────────── */
(function init() {
  $('footBuild').textContent = '문의 ' + CFG.contactEmail + ' | 본 카탈로그는 고객사 제안용 자료입니다.';
  if (CFG.submitUrl) {
    $('pNote').innerHTML = '‘문의 접수하기’를 누르면 담당자에게 <b>바로 접수</b>되고 접수번호가 발급됩니다.<br>'
      + '수량은 비워두셔도 접수 가능합니다 — 담당자가 확인 후 견적서로 회신드립니다.<br>'
      + '내부 결재용 자료가 필요하시면 <b>PDF 저장</b>을 이용하세요.';
  } else {
    // 접수 서버(Apps Script) 미설정 상태
    $('bSend').style.display = 'none';
    $('bPdf').classList.add('primary');
    $('pNote').innerHTML = '<b>PDF 저장</b>으로 내려받아 ' + esc(CFG.contactEmail) + ' 로 보내주세요.<br>'
      + '수량은 비워두셔도 문의 가능합니다 — 담당자가 확인 후 견적서로 회신드립니다.';
  }
  buildChips(); render(); syncSel();
})();
</script>
