<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 추석 단체선물대장 상품 카탈로그</title>
<style>
  :root {
    --ink:#1a202c; --ink-2:#4a5568; --ink-3:#8492a6;
    --line:#e2e8f0; --line-soft:#edf2f7; --bg:#f7fafc; --card:#fff;
    --accent:#2b6cb0; --accent-deep:#1e3a5f; --accent-soft:#ebf4fb; --accent-line:#bcd8ef;
    --pink:#e8386d; --pink-soft:#fdeef3; --pink-line:#f6bdd0;
    --gold:#9c6f19; --gold-soft:#fdf6e7; --gold-line:#ecd9a8;
    --good-ink:#276749; --good-bg:#eefaf2; --good-line:#bfe6cd;
    --danger:#c53030; --danger-bg:#fdf0ef; --danger-line:#f2c4c0;
    --shadow:0 1px 2px rgba(26,32,44,.04), 0 4px 12px rgba(26,32,44,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
       color:var(--ink);background:var(--bg);line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1760px;margin:0 auto;padding:0 28px 150px}

  /* ── 상단 고정 마감 배너 ─────────────── */
  .dbanner{position:sticky;top:0;z-index:120;background:linear-gradient(90deg,#1e3a5f,#2b6cb0);
           color:#fff;text-align:center;padding:9px 16px;font-size:13.5px;letter-spacing:.01em}
  .dbanner b{font-weight:800}
  .dbanner .dd{background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;margin:0 6px;font-weight:800}
  .dbanner .sep{opacity:.5;margin:0 8px}
  .dbanner.urgent{background:linear-gradient(90deg,#9b2c2c,#c53030)}
  .dbanner.closed{background:#4a5568}

  /* ── 헤더 ───────────────────────────── */
  header.hd{padding:26px 0 18px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  header.hd h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.01em}
  header.hd h1 span{color:var(--accent)}
  header.hd .sub{font-size:13px;color:var(--ink-3);padding-bottom:3px}

  /* ── 검색 ───────────────────────────── */
  .searchbox{position:relative;margin-bottom:16px}
  .searchbox input{width:100%;padding:13px 16px 13px 42px;font-size:15px;font-family:inherit;
    border:2px solid var(--pink-line);border-radius:10px;background:var(--card);color:var(--ink)}
  .searchbox input:focus{outline:none;border-color:var(--pink)}
  .searchbox::before{content:"⌕";position:absolute;left:15px;top:50%;transform:translateY(-50%);
    color:var(--ink-3);font-size:21px;line-height:1}

  /* ── 탭 ─────────────────────────────── */
  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px}
  .tabs button{border:0;background:none;font-family:inherit;font-size:15px;font-weight:700;
    color:var(--ink-3);padding:10px 20px;cursor:pointer;position:relative;top:2px;
    border-bottom:3px solid transparent}
  .tabs button:hover{color:var(--ink-2)}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .tabs .hint{margin-left:auto;align-self:center;font-size:12px;color:var(--ink-3);font-weight:400;padding-bottom:6px}

  /* ── 칩 ─────────────────────────────── */
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:999px;
    padding:7px 15px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap}
  .chip:hover{border-color:var(--pink-line);color:var(--pink)}
  .chip.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}
  .chip .c{opacity:.62;font-size:11.5px;margin-left:4px}
  .chip.on .c{opacity:.8}
  .chip:disabled{opacity:.38;cursor:default}
  .chip:disabled:hover{border-color:var(--line);color:var(--ink-2)}

  /* ── 툴바 ───────────────────────────── */
  .toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:16px}
  .toolbar .count{font-size:13.5px;color:var(--ink-2)}
  .toolbar .count b{color:var(--ink);font-size:15px;font-weight:800}
  .spacer{flex:1 1 auto}
  select.sel,.btn{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--ink-2);padding:7px 12px;cursor:pointer}
  select.sel:focus{outline:none;border-color:var(--accent)}
  .btn{font-weight:600}
  .btn:hover{border-color:var(--ink-3);color:var(--ink)}
  .btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
  .btn.primary:hover{background:#c92a5b;border-color:#c92a5b}
  .btn.ghost.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.42;cursor:default}
  .btn:disabled:hover{border-color:var(--line);color:var(--ink-2)}
  .viewtog{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .viewtog button{border:0;background:var(--card);color:var(--ink-3);font-family:inherit;font-size:12.5px;
    padding:7px 13px;cursor:pointer;font-weight:600}
  .viewtog button.on{background:var(--accent);color:#fff}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
  .toggle input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}

  /* ── 카드 그리드 ─────────────────────── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s,transform .15s;position:relative}
  .pcard:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--accent-line)}
  .pcard.sel{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink-soft)}
  .pcard .pick{position:absolute;left:9px;top:9px;z-index:2;width:24px;height:24px;
    accent-color:var(--pink);cursor:pointer}
  .thumb{width:100%;aspect-ratio:1/1;background:#fff;cursor:pointer;overflow:hidden;
    border-bottom:1px solid var(--line-soft)}
  .thumb img{width:100%;height:100%;object-fit:contain;display:block}
  .pbody{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}
  .prow1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .tag{font-size:10.5px;border-radius:5px;padding:2px 7px;font-weight:700;letter-spacing:.01em}
  .tag.cat{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
  .tag.tax{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-line)}
  .tag.code{background:var(--line-soft);color:var(--ink-3);font-family:ui-monospace,Consolas,monospace;font-weight:600}
  .pname{font-size:13.5px;font-weight:700;line-height:1.42;margin-bottom:6px;cursor:pointer;min-height:38px}
  .pname:hover{color:var(--accent)}
  .pmeta{font-size:11.5px;color:var(--ink-3);line-height:1.45;margin-bottom:4px}
  .pmeta b{color:var(--ink-2);font-weight:600}
  .pcomp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:33px}
  .pdesc{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin:6px 0 10px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pdesc a{color:var(--pink);text-decoration:none;font-weight:600}
  .pprice{margin-top:auto;display:flex;align-items:flex-end;gap:7px;flex-wrap:wrap}
  .pprice .now{font-size:19px;font-weight:800;color:var(--pink);letter-spacing:-.01em;line-height:1.1}
  .pprice .now small{font-size:13px;font-weight:700}
  .pprice .rate{font-size:11.5px;font-weight:800;color:#fff;background:var(--pink);border-radius:4px;padding:1px 5px}
  .pprice .was{font-size:12px;color:var(--ink-3);text-decoration:line-through}
  body.nomoney .pprice,body.nomoney .m-price,body.nomoney .money{visibility:hidden}
  body.nomoney .pprice::after{content:"가격 별도 안내";visibility:visible;font-size:12.5px;color:var(--ink-3)}

  /* ── 리스트(테이블) 뷰 ───────────────── */
  .tblwrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
  table.list{width:100%;border-collapse:collapse;font-size:13px;min-width:1080px}
  table.list th{background:var(--bg);text-align:left;padding:11px 10px;font-size:12px;color:var(--ink-3);
    font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
  table.list td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  table.list tr:last-child td{border-bottom:0}
  table.list tr.sel{background:var(--pink-soft)}
  table.list tr:hover{background:var(--accent-soft)}
  table.list tr.sel:hover{background:#fbe2ea}
  table.list img{width:74px;height:74px;object-fit:contain;background:#fff;border:1px solid var(--line-soft);border-radius:6px;cursor:pointer}
  table.list .c-code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
  table.list .c-name{font-weight:700;min-width:210px;max-width:300px;cursor:pointer}
  table.list .c-name:hover{color:var(--accent)}
  table.list .c-comp{color:var(--ink-2);min-width:180px;max-width:280px;font-size:12px}
  table.list .c-desc{color:var(--ink-2);min-width:300px;font-size:12px;line-height:1.55}
  table.list .c-desc .cut{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  table.list .c-desc a{color:var(--pink);text-decoration:none;font-weight:600;font-size:11.5px}
  table.list .c-price{text-align:right;white-space:nowrap}
  table.list .c-price .now{font-size:15px;font-weight:800;color:var(--pink)}
  table.list .c-price .rate{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--pink);
    border-radius:4px;padding:0 4px;margin-left:3px}
  table.list .c-price .was{display:block;font-size:11.5px;color:var(--ink-3);text-decoration:line-through}
  table.list input[type=checkbox]{width:19px;height:19px;accent-color:var(--pink);cursor:pointer}

  .empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--ink-3);
    background:var(--card);border:1px dashed var(--line);border-radius:12px}

  /* ── 상세 모달 ───────────────────────── */
  .mbg{position:fixed;inset:0;background:rgba(26,32,44,.55);z-index:200;display:none;
    align-items:center;justify-content:center;padding:24px}
  .mbg.open{display:flex}
  .modal{background:var(--card);border-radius:14px;max-width:900px;width:100%;max-height:88vh;overflow:auto;position:relative}
  .modal .x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;
    border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:17px;cursor:pointer;z-index:2}
  .modal .x:hover{background:var(--bg);color:var(--ink)}
  .m-top{display:grid;grid-template-columns:330px 1fr;gap:26px;padding:28px 30px 22px}
  .m-img{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .m-img img{width:100%;display:block}
  .m-name{font-size:21px;font-weight:800;margin:8px 0 14px;line-height:1.35}
  .m-price{margin-bottom:18px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .m-price .now{font-size:27px;font-weight:800;color:var(--pink);letter-spacing:-.01em}
  .m-price .rate{font-size:13px;font-weight:800;color:#fff;background:var(--pink);border-radius:5px;padding:2px 7px}
  .m-price .was{font-size:14px;color:var(--ink-3);text-decoration:line-through}
  .m-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px}
  .m-tbl th{text-align:left;padding:7px 12px 7px 0;color:var(--ink-3);font-weight:600;width:78px;
    vertical-align:top;white-space:nowrap}
  .m-tbl td{padding:7px 0;color:var(--ink-2);vertical-align:top;border-bottom:1px solid var(--line-soft)}
  .m-tbl tr:last-child td{border-bottom:0}
  .m-desc{border-top:1px solid var(--line);padding:20px 30px 28px;font-size:13.5px;color:var(--ink-2);
    white-space:pre-wrap;line-height:1.75}
  .m-desc h4{margin:0 0 10px;font-size:12px;color:var(--ink-3);letter-spacing:.06em;font-weight:700}
  @media (max-width:780px){.m-top{grid-template-columns:1fr;padding:22px 20px 18px}}

  /* ── 하단 고정 선택바 ───────────────── */
  .selbar{position:fixed;left:0;right:0;bottom:0;z-index:150;background:rgba(255,255,255,.97);
    border-top:1px solid var(--line);box-shadow:0 -3px 16px rgba(26,32,44,.1);backdrop-filter:blur(6px);
    transform:translateY(105%);transition:transform .22s ease}
  .selbar.show{transform:translateY(0)}
  .selbar-in{max-width:1760px;margin:0 auto;padding:13px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .selbar .sum{font-size:14px;color:var(--ink-2)}
  .selbar .sum b{color:var(--ink);font-size:17px;font-weight:800}
  .selbar .sum .tot{color:var(--pink);font-weight:800;font-size:18px}

  /* ── 문의 패널 ───────────────────────── */
  .pbg{position:fixed;inset:0;background:rgba(26,32,44,.5);z-index:210;display:none}
  .pbg.open{display:block}
  .panel{position:fixed;right:0;top:0;bottom:0;width:720px;max-width:100%;background:var(--bg);z-index:220;
    display:flex;flex-direction:column;transform:translateX(100%);transition:transform .24s ease}
  .panel.open{transform:translateX(0)}
  .p-hd{padding:18px 24px;background:var(--card);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between}
  .p-hd h3{margin:0;font-size:17px;font-weight:800}
  .p-hd .x{border:0;background:none;font-size:23px;color:var(--ink-3);cursor:pointer;line-height:1}
  .p-body{flex:1;overflow:auto;padding:18px 22px}
  .p-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .p-form label{font-size:11.5px;color:var(--ink-3);font-weight:700;display:block;margin-bottom:4px}
  .p-form input{width:100%;padding:8px 11px;font-size:13.5px;font-family:inherit;border:1px solid var(--line);
    border-radius:7px;background:var(--card);color:var(--ink)}
  .p-form input:focus{outline:none;border-color:var(--accent)}
  table.qt{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);
    border:1px solid var(--line);border-radius:9px;overflow:hidden}
  table.qt th{background:var(--bg);padding:9px 8px;font-size:11.5px;color:var(--ink-3);font-weight:700;
    text-align:left;border-bottom:1px solid var(--line)}
  table.qt td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  table.qt tr:last-child td{border-bottom:0}
  table.qt img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:5px}
  table.qt .nm{font-weight:700;line-height:1.35}
  table.qt .cd{font-size:11px;color:var(--ink-3);font-family:ui-monospace,Consolas,monospace}
  table.qt .num{text-align:right;white-space:nowrap}
  table.qt input.q{width:62px;padding:5px 7px;font-size:13px;font-family:inherit;text-align:center;
    border:1px solid var(--line);border-radius:6px;-moz-appearance:textfield}
  table.qt input.q::-webkit-outer-spin-button,table.qt input.q::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  table.qt input.q:focus{outline:none;border-color:var(--accent);background:var(--accent-soft)}
  table.qt .del{border:0;background:none;color:var(--ink-3);font-size:16px;cursor:pointer;line-height:1}
  table.qt .del:hover{color:var(--danger)}
  .p-ft{border-top:1px solid var(--line);background:var(--card);padding:15px 22px 20px}
  .ft-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2);margin-bottom:5px}
  .ft-row.total{font-size:17px;font-weight:800;color:var(--ink);padding-top:8px;border-top:1px solid var(--line);margin-top:8px}
  .ft-row.total span:last-child{color:var(--pink)}
  .ft-btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .ft-btns .btn{flex:1 1 130px;text-align:center;padding:10px 12px;font-size:13.5px}
  .ft-note{font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.55}
  .req{color:var(--pink);margin-left:2px}
  .p-form input.bad{border-color:var(--pink);background:var(--pink-soft)}
  .sent{background:var(--card);border:1px solid var(--good-line);border-radius:12px;padding:34px 26px;text-align:center}
  .sent .ico{font-size:40px;line-height:1;margin-bottom:12px}
  .sent h4{margin:0 0 8px;font-size:19px;font-weight:800;color:var(--good-ink)}
  .sent p{margin:0 0 6px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
  .sent .rid{display:inline-block;margin:12px 0 4px;background:var(--good-bg);border:1px solid var(--good-line);
    color:var(--good-ink);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;
    font-family:ui-monospace,Consolas,monospace}
  .sent.warn{border-color:var(--gold-line)}
  .sent.warn h4{color:var(--gold)}
  .sent.warn .rid{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}
  .sent.fail{border-color:var(--danger-line)}
  .sent.fail h4{color:var(--danger)}

  .toast{position:fixed;left:50%;bottom:98px;transform:translate(-50%,14px);background:var(--ink);color:#fff;
    padding:10px 20px;border-radius:999px;font-size:13.5px;z-index:300;opacity:0;pointer-events:none;transition:all .2s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  footer.foot{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;
    color:var(--ink-3);line-height:1.75}
  footer.foot b{color:var(--ink-2)}

  /* ── 인쇄(문의서 PDF) ───────────────── */
  #printArea{display:none}
  @media print{
    body{background:#fff}
    body>*:not(#printArea){display:none !important}
    #printArea{display:block !important;padding:0;font-size:12px;color:#000}
    #printArea h2{font-size:19px;margin:0 0 4px}
    #printArea .pmeta{font-size:11.5px;color:#555;margin-bottom:14px}
    #printArea table{width:100%;border-collapse:collapse;font-size:11px}
    #printArea th,#printArea td{border:1px solid #bbb;padding:6px 7px;text-align:left;vertical-align:top}
    #printArea th{background:#f0f2f5;font-weight:700}
    #printArea td.num{text-align:right;white-space:nowrap}
    #printArea tr.tot td{font-weight:800;background:#f7f9fb}
    #printArea .note{margin-top:12px;font-size:10.5px;color:#555;line-height:1.6}
    #printArea img{width:46px;height:46px;object-fit:contain}
    @page{margin:14mm}
  }

  @media (max-width:640px){
    .wrap{padding:0 12px 160px}
    header.hd h1{font-size:20px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
    .pname{font-size:12.5px;min-height:36px}
    .tabs button{padding:9px 14px;font-size:14px}
    .p-form{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="dbanner" id="dbanner"></div>

<div class="wrap">
  <header class="hd">
    <h1>2026 추석 <span>단체선물대장</span> 상품 카탈로그</h1>
    <div class="sub" id="hdSub"></div>
  </header>

  <div class="searchbox">
    <input type="text" id="q" placeholder="상품코드 · 상품명 · 구성으로 검색 (예: SG26040001, 스팸, 홍삼)" autocomplete="off">
  </div>

  <div class="tabs">
    <button data-tab="price" class="on">가격대별</button>
    <button data-tab="cat">카테고리별</button>
    <span class="hint">칩을 클릭하면 해당 그룹의 확정 상품만 표시됩니다</span>
  </div>
  <div class="chips" id="chips"></div>

  <div class="toolbar">
    <span class="count"><b id="cnt">0</b>개 표시 <span id="cntSub" style="color:var(--ink-3);font-size:12.5px"></span></span>
    <span class="spacer"></span>
    <label class="toggle"><input type="checkbox" id="noMoney"> 금액 숨기고 보기</label>
    <select class="sel" id="sort">

/* ── 유틸 ───────────────────────────── */
const $ = id => document.getElementById(id);
const won = n => n.toLocaleString('ko-KR') + '원';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rate = p => (p.was > p.price && p.price > 0) ? Math.round((1 - p.price / p.was) * 100) : 0;
const dday = iso => Math.ceil((new Date(iso + 'T23:59:59') - new Date()) / 86400000);

/* ── 상태 ───────────────────────────── */
const st = { tab: 'price', chip: '__all__', q: '', sort: 'def', view: 'list', onlySel: false };

/* ── 마감 배너 : 공식 주문 마감만 노출 ── */
(function banner() {
  const b = $('dbanner'), d = dday(CFG.dueOfficial);
  if (d > 0) {
    b.innerHTML = '🎁 <b>공식 주문 마감</b><span class="dd">D-' + d + '</span>' + CFG.dueOfficial + ' 까지';
  } else if (d === 0) {

  } else {

  }
})();

/* ── 그룹 정의 ──────────────────────── */
const inBand = (p, b) => p.price >= b.min && p.price < b.max;
function groups() {
  return st.tab === 'price'
    ? CFG.bands.map(b => ({ k: b.k, label: b.label, n: DATA.filter(p => inBand(p, b)).length }))
    : CFG.cats.map(c => ({ k: c, label: c, n: DATA.filter(p => p.cat === c).length }));
}
function buildChips() {
  const gs = groups();
  $('chips').innerHTML = '<button class="chip' + (st.chip === '__all__' ? ' on' : '') + '" data-k="__all__">전체<span class="c">'
    + DATA.length + '</span></button>'
    + gs.map(g => '<button class="chip' + (st.chip === g.k ? ' on' : '') + '" data-k="' + esc(g.k) + '"'
        + (g.n ? '' : ' disabled') + '>' + esc(g.label) + '<span class="c">' + g.n + '</span></button>').join('');
}

/* ── 필터 ───────────────────────────── */
function filtered() {
  const q = st.q.trim().toLowerCase();
  let list = DATA.filter(p => {
    if (st.onlySel && !sel.has(p.code)) return false;
    if (q && !(p.name + ' ' + p.code + ' ' + p.comp + ' ' + p.cat + ' ' + p.desc).toLowerCase().includes(q)) return false;
    if (st.chip !== '__all__') {
      if (st.tab === 'price') { const b = CFG.bands.find(x => x.k === st.chip); if (!b || !inBand(p, b)) return false; }
      else if (p.cat !== st.chip) return false;
    }
    return true;
  });
  const s = st.sort;
  if (s === 'pl') list.sort((a, b) => a.price - b.price);
  else if (s === 'ph') list.sort((a, b) => b.price - a.price);
  else if (s === 'rt') list.sort((a, b) => rate(b) - rate(a) || a.price - b.price);
  else if (s === 'nm') list.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  return list;
}

/* ── 가격 표기 ──────────────────────── */
function priceCard(p) {
  const r = rate(p);
  return '<div class="pprice"><span class="now">' + p.price.toLocaleString('ko-KR') + '<small>원</small></span>'
    + (r ? '<span class="rate">' + r + '%↓</span><span class="was">' + p.was.toLocaleString('ko-KR') + '원</span>' : '')
    + '</div>';
}

function render() {
  const list = filtered();

}

/* silent=true 면 syncSel()을 건너뛴다 — 전체선택처럼 여러 건을 한 번에 바꿀 때,
   루프 도중 syncSel()이 체크박스 상태를 되돌려 첫 건만 반영되는 문제를 막는다. */
function toggle(code, force, silent) {
  const on = force != null ? force : !sel.has(code);
  if (on) { if (!sel.has(code)) sel.set(code, null); } else sel.delete(code);
  if (!silent) syncSel();
}
function syncSel() {
  const n = sel.size;
  const rows = selRows();
  const tot = rows.reduce((s, r) => s + (r.qty ? r.qty * r.p.price : 0), 0);
  const qty = rows.reduce((s, r) => s + (r.qty || 0), 0);

  $('sbN').textContent = n;

  $('selbar').classList.toggle('show', n > 0);
  $('onlySel').textContent = '선택한 상품만 보기 (' + n + ')';
  $('onlySel').disabled = !n; $('clearSel').disabled = !n;
  $('ftN').textContent = n + '개'; $('ftQ').textContent = qty.toLocaleString('ko-KR') + '개';
  $('ftTot').textContent = qty ? won(tot) : '수량 입력 시 자동 계산';

  document.querySelectorAll('[data-pick]').forEach(el => {
    const on = sel.has(el.dataset.pick);
    if (el.type === 'checkbox') el.checked = on;
    else if (el.dataset.btn) el.textContent = on ? '선택됨 ✓ (해제하기)' : '이 상품 선택하기';
  });

    el.classList.toggle('sel', sel.has(el.dataset.code)));

  if (st.onlySel && !n) { st.onlySel = false; $('onlySel').classList.remove('on'); render(); }
  renderQt();
}

function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800); }

/* ── 문의 접수 (구글시트 적재) ──────────────────
   CFG.submitUrl = Apps Script 웹 앱 URL. 비어 있으면 접수 버튼을 숨기고 메일 안내로 대체한다. */
function inquiryId() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return 'Q' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds())
    + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
}
function validate() {
  const need = [['fCo', 'rqCo'], ['fName', 'rqName'], ['fTel', 'rqTel']];
  let bad = null;
  need.forEach(([i]) => {
    const el = $(i), empty = !el.value.trim();
    el.classList.toggle('bad', empty);
    if (empty && !bad) bad = el;
  });
  if (bad) { bad.focus(); toast('고객사명 · 담당자 · 연락처는 필수입니다.'); return false; }
  return true;
}
function payload() {
  const rows = selRows(), f = form();
  return {
    inquiryId: inquiryId(),
    submittedAt: new Date().toISOString(),
    company: f.co, contact: f.nm, phone: f.tel, wishDate: f.date,
    source: '웹카탈로그', season: CFG.season,
    dueOfficial: CFG.dueOfficial,
    itemCount: rows.length,
    totalQty: rows.reduce((s, r) => s + (r.qty || 0), 0),
    totalAmount: rows.reduce((s, r) => s + (r.qty ? r.qty * r.p.price : 0), 0),
    items: rows.map(r => ({
      code: r.p.code, name: r.p.name, cat: r.p.cat, tax: r.p.tax,
      price: r.p.price, qty: r.qty || '', amount: r.qty ? r.qty * r.p.price : ''
    }))
  };
}
function showSent(kind, id, msg, title) {
  const cls = kind === 'ok' ? '' : (kind === 'warn' ? ' warn' : ' fail');
  const ico = kind === 'ok' ? '✅' : (kind === 'warn' ? '📨' : '⚠️');
  const ttl = title || (kind === 'ok' ? '문의가 접수되었습니다' : (kind === 'warn' ? '문의를 전송했습니다' : '전송에 실패했습니다'));
  document.querySelector('.p-body').innerHTML =
    '<div class="sent' + cls + '"><div class="ico">' + ico + '</div><h4>' + ttl + '</h4>'
    + '<p>' + msg + '</p>'
    + (id ? '<div class="rid">접수번호 ' + esc(id) + '</div>' : '')
    + '<p style="margin-top:14px"><button class="btn" id="bAgain">다른 상품 더 담기</button></p></div>';
  document.querySelector('.p-ft').style.display = 'none';
}
async function submitInquiry() {
  if (!sel.size) return toast('선택한 상품이 없습니다.');
  if (!validate()) return;
  const btn = $('bSend'), data = payload(), body = JSON.stringify(data);
  btn.disabled = true; btn.textContent = '전송 중…';

  // 실패 화면에서도 CSV·PDF로 내보낼 수 있도록 하단 버튼을 되살린다.
  const fallback = () => { document.querySelector('.p-ft').style.display = ''; $('bSend').style.display = 'none'; };

  let ack = null;   // 서버 응답을 실제로 읽었을 때만 채워진다
  try {
    // Content-Type을 지정하지 않아야 preflight 없이 Apps Script가 응답을 돌려준다.
    const res = await fetch(CFG.submitUrl, { method: 'POST', body: body });
    ack = await res.json();
  } catch (e) { /* 응답을 못 읽음 — 아래에서 no-cors로 재시도 */ }

  try {
    if (ack) {
      // 응답을 받았다면 그 판정을 그대로 따른다. 서버가 거부한 건은 재전송하지 않는다.
      if (ack.ok) {
        showSent('ok', ack.inquiryId || data.inquiryId,
          '담당자가 확인 후 <b>영업일 기준 1일 이내</b>에 견적서로 회신드립니다.<br>접수번호를 남겨 두시면 진행 상황을 조회하실 수 있습니다.');
      } else {
        showSent('fail', null, esc(ack.error || '알 수 없는 오류')
          + '<br>입력값을 확인하시거나 <b>엑셀(CSV)</b>로 내려받아 ' + esc(CFG.contactEmail) + ' 로 보내주세요.',
          '접수가 반려되었습니다');
        fallback();
      }
    } else {
      // 로컬 파일·사내 프록시 등 응답을 읽을 수 없는 환경 — 전송만 시도하고 결과는 단정하지 않는다.
      await fetch(CFG.submitUrl, { method: 'POST', mode: 'no-cors', body: body });
      showSent('warn', data.inquiryId,
        '전송은 되었으나 접수 확인 응답을 받지 못했습니다.<br>확실히 하시려면 아래 <b>엑셀(CSV)</b>을 내려받아 '
        + esc(CFG.contactEmail) + ' 로도 보내주세요.');
      fallback();
    }
  } catch (e) {
    showSent('fail', null,
      '네트워크 문제로 접수하지 못했습니다.<br><b>엑셀(CSV)</b> 또는 <b>PDF</b>로 내려받아 '
      + esc(CFG.contactEmail) + ' 로 보내주세요.');
    fallback();
  } finally {
    btn.disabled = false; btn.textContent = '문의 접수하기';
  }
}

    $('pNote').innerHTML = '‘문의 접수하기’를 누르면 담당자에게 <b>바로 접수</b>되고 접수번호가 발급됩니다.<br>'
      + '수량은 비워두셔도 접수 가능합니다 — 담당자가 확인 후 견적서로 회신드립니다.<br>'
      + '내부 결재용으로 필요하시면 <b>엑셀(CSV)</b>·<b>PDF 저장</b>도 함께 이용하세요.';
  } else {
    // 접수 서버(Apps Script) 미설정 상태 — 메일 접수로 대체
    $('bSend').style.display = 'none';
    $('bMail').classList.add('primary'); $('bMail').style.flex = '1 1 100%';
    $('pNote').innerHTML = '‘메일로 보내기’는 기본 메일 프로그램을 엽니다. 사용이 어려우면 <b>엑셀(CSV)</b> 또는 '
      + '<b>PDF 저장</b>으로 내려받아 ' + esc(CFG.contactEmail) + ' 로 보내주세요.<br>'
      + '수량은 비워두셔도 문의 가능합니다 — 담당자가 확인 후 견적서로 회신드립니다.';
  }
  buildChips(); render(); syncSel();
})();
</script>
